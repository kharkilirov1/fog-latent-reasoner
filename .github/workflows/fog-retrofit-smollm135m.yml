name: FOG retrofit SmolLM2-135M experiment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fog-retrofit-smollm135m.yml'
      - 'experiments/fog_retrofit_smollm135m.py'

jobs:
  retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' 'datasets>=2.20' 'accelerate>=0.33' 'numpy>=1.26'
      - name: Run frozen-backbone FOG retrofit experiment
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/fog_retrofit_smollm135m.py 2>&1 | tee retrofit.log
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-retrofit-smollm135m
          path: |
            retrofit.log
            retrofit_results.json
            retrofit_adapters.pt
          if-no-files-found: warn
