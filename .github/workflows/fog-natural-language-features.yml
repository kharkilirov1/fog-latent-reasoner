name: FOG natural-language frozen-Qwen features

on:
  push:
    branches:
      - agent/fog-v2-natural-language-audit
    paths:
      - 'research/retrofit/natural_language_audit.py'
      - 'research/retrofit/extract_natural_language_features.py'
      - '.github/workflows/fog-natural-language-features.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers==5.0.0' accelerate safetensors
      - name: Extract frozen Qwen features only
        working-directory: research/retrofit
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python extract_natural_language_features.py 2>&1 | tee natural_language_qwen_features.log
      - name: Upload fixed audit features
        uses: actions/upload-artifact@v4
        with:
          name: fog-natural-language-qwen-features
          path: |
            research/retrofit/natural_language_qwen_features.pt
            research/retrofit/natural_language_qwen_features.json
            research/retrofit/natural_language_qwen_features.log
          retention-days: 7
