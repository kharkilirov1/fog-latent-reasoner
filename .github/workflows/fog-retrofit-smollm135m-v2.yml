name: FOG retrofit SmolLM2 bridge curriculum v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fog-retrofit-smollm135m-v2.yml'
      - 'experiments/fog_retrofit_smollm135m_v2.py'

concurrency:
  group: fog-retrofit-smollm135m-v2
  cancel-in-progress: true

jobs:
  retrofit-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' 'datasets>=2.20' 'numpy>=1.26'
      - name: Run bridge-probe curriculum experiment
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/fog_retrofit_smollm135m_v2.py 2>&1 | tee retrofit_v2.log
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-retrofit-smollm135m-v2
          path: |
            retrofit_v2.log
            retrofit_v2_results.json
            retrofit_v2_fog.pt
          if-no-files-found: warn
