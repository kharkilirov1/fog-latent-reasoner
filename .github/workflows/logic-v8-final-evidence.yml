name: Logic v8 final reproducible evidence
on:
  push:
    branches: [agent/logic-v8-integrity-role-routing-20260906]
    paths: ['.github/workflows/logic-v8-final-evidence.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: logic-v8-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/logic_v8/requirements.txt
          mkdir -p final-evidence
          python -m pip freeze > final-evidence/environment.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: 33991379408
          github-token: ${{ github.token }}
          merge-multiple: true
          path: trained
      - uses: actions/download-artifact@v4
        with:
          run-id: 33989856982
          github-token: ${{ github.token }}
          name: logic-v8-train-dev-features
          path: features
      - name: Evaluate frozen candidate and record hashes
        run: |
          set -o pipefail
          sha256sum trained/logic-v8-artifacts/fog_logic_v8_2.pt > final-evidence/CHECKPOINT_SHA256.txt
          python -m pytest research/logic_v8 -q --junitxml=final-evidence/junit.xml
          python -u research/logic_v8/relation_probe.py --checkpoint trained/logic-v8-artifacts/fog_logic_v8_2.pt --features features/logic-v8-features.pt --config final-evidence/relation-reader.json --output final-evidence/results.json 2>&1 | tee final-evidence/run.log
      - name: Persist measured results only on this experiment branch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('final-evidence/results.json', 'utf8');
            const data = JSON.parse(raw);
            const summary = {
              protocol: data.protocol,
              source_commit: context.sha,
              run_id: context.runId,
              selected_prompt: data.selected,
              eligible_for_integration: data.eligible_for_integration,
              candidates: data.candidates.map(x => ({train: x.train.accuracy, dev: x.dev.accuracy})),
              previous_test_is_regression_only: true,
              previous_test_regression: data.old_test_regression || null,
              fresh_relation_only: data.fresh_relation_only.accuracy,
              fresh_full_instruction: data.fresh_full_instruction,
              model_updated: false,
              checkpoint_sha256: fs.readFileSync('final-evidence/CHECKPOINT_SHA256.txt', 'utf8').split(/\s+/)[0]
            };
            for (const [path, content] of [
                ['research/results/RESULT-logic-v8-relation-probe.json', raw],
                ['research/results/RESULT-logic-v8-relation-summary.json', JSON.stringify(summary, null, 2)]]) {
              let sha;
              try { const old = await github.rest.repos.getContent({...context.repo, path, ref: context.ref}); sha = old.data.sha; }
              catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({...context.repo, path,
                branch: context.ref.replace('refs/heads/',''), sha,
                message: 'results(v8): persist measured semantic probe evidence',
                content: Buffer.from(content).toString('base64')});
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-v8-final-evidence-${{ github.sha }}
          path: |
            final-evidence/
            research/logic_v8/
          retention-days: 14
