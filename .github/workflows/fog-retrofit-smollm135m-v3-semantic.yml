name: FOG retrofit SmolLM2 semantic bridge v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fog-retrofit-smollm135m-v3-semantic.yml'
      - 'experiments/fog_retrofit_smollm135m_v3_semantic_bridge.py'

concurrency:
  group: fog-retrofit-smollm135m-v3-semantic
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' 'numpy>=1.26'
      - name: Run semantic bridge experiment
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/fog_retrofit_smollm135m_v3_semantic_bridge.py 2>&1 | tee semantic.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-retrofit-smollm135m-v3-semantic
          path: |
            semantic.log
            retrofit_v3_semantic_results.json
            retrofit_v3_semantic_parsers.pt
          if-no-files-found: warn
