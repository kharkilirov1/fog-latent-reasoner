name: Logic v8 integrity and role routing
on:
  push:
    branches: [agent/logic-v8-integrity-role-routing-20260906]
    paths: ['research/logic_v8/**', '.github/workflows/logic-v8-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logic-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU experiment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest 'transformers>=4.45,<5' accelerate
          mkdir -p logic-v8-artifacts
          python -m pip freeze > logic-v8-artifacts/environment.txt
      - name: Regression tests and immutable reference audit
        run: |
          python -m pytest research/logic_v8 -v --junitxml=logic-v8-artifacts/junit.xml
          python research/logic_v8/run.py --training-texts declared --audit-only --output logic-v8-artifacts/audit.json
      - name: Train v8.1 with restored declared training templates
        run: |
          set -o pipefail
          python -u research/logic_v8/run.py --training-texts declared --device cpu --threads 2 --output logic-v8-artifacts/dev-results.json --checkpoint logic-v8-artifacts/fog_logic_v8.pt 2>&1 | tee logic-v8-artifacts/train.log
      - name: Locked evaluation only after development qualification
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          p = pathlib.Path('logic-v8-artifacts')
          r = json.loads((p/'dev-results.json').read_text())
          d = r['dev_program_eval']
          eligible = r['train_program_eval']['accuracy'] >= .99 and d['accuracy'] >= .90 and d['bind_instruction_joint'] >= .90
          (p/'dev-gate.json').write_text(json.dumps({'eligible':eligible,'train_accuracy':r['train_program_eval']['accuracy'],'dev_accuracy':d['accuracy'],'dev_bind':d['bind_instruction_joint']},indent=2))
          if eligible:
              subprocess.check_call([sys.executable,'-u','research/logic_v8/run.py','--training-texts','declared','--device','cpu','--threads','2','--evaluate-checkpoint',str(p/'fog_logic_v8.pt'),'--locked','--output',str(p/'locked-results.json')])
          else:
              print('Development gate failed. Locked test was NOT evaluated.')
          PY
      - name: Standalone text inference, without gold labels
        run: |
          python research/logic_v8/predict.py --checkpoint logic-v8-artifacts/fog_logic_v8.pt --input research/logic_v8/example_program.txt --device cpu --trace --output logic-v8-artifacts/example-prediction.json
      - name: Export code, checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-v8-integrity-${{ github.sha }}
          path: |
            logic-v8-artifacts/
            artifacts/logic-v7-copy-bound-entity-roles/fog_logic_v7_final.py
            artifacts/logic-v7-copy-bound-entity-roles/fog_logic_v7_results.json
            artifacts/logic-v7-copy-bound-entity-roles/LOGIC_V7_PROTOCOL.md
            research/logic_v8/
          retention-days: 14
