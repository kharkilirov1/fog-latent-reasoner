name: Logic v8 train-dev feature witness
on:
  push:
    branches: [agent/logic-v8-integrity-role-routing-20260906]
    paths: ['tools/logic_v8_export_features.py', '.github/workflows/logic-v8-features.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen feature dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy 'transformers>=4.45,<5' accelerate
      - name: Encode training and development only
        run: |
          set -o pipefail
          python -u tools/logic_v8_export_features.py --output logic-v8-features.pt | tee feature-export.log
      - uses: actions/upload-artifact@v4
        with:
          name: logic-v8-train-dev-features
          path: |
            logic-v8-features.pt
            feature-export.log
          retention-days: 14
