name: Logic v8 relation semantics probe
on:
  push:
    branches: [agent/logic-v8-integrity-role-routing-20260906]
    paths: ['research/logic_v8/relation_probe.py', '.github/workflows/logic-v8-relation-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: logic-v8-relation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/logic_v8/requirements.txt
          mkdir -p relation-evidence
          python -m pip freeze > relation-evidence/environment.txt
      - uses: actions/download-artifact@v4
        with:
          name: logic-v8-2-locked-2d51a0fc1fc7d2e0c3474113869ee6565fa1b911
          run-id: 33991379408
          github-token: ${{ github.token }}
          path: trained
      - uses: actions/download-artifact@v4
        with:
          name: logic-v8-train-dev-features
          run-id: 33989856982
          github-token: ${{ github.token }}
          path: features
      - name: Regression tests and frozen relation probe
        run: |
          set -o pipefail
          echo '0105b7e3b89660bf58679e6c23d6c40af251d7d90d27b61ec897cddf1d581d31  trained/logic-v8-artifacts/fog_logic_v8_2.pt' | sha256sum -c
          python -m pytest research/logic_v8 -q --junitxml=relation-evidence/junit.xml
          python -u research/logic_v8/relation_probe.py --checkpoint trained/logic-v8-artifacts/fog_logic_v8_2.pt --features features/logic-v8-features.pt --config relation-evidence/relation-reader.json --output relation-evidence/results.json 2>&1 | tee relation-evidence/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-v8-relation-probe-${{ github.sha }}
          path: |
            relation-evidence/
            research/logic_v8/
          retention-days: 14
