name: Logic v8 post-locked relation diagnostic
on:
  push:
    branches: [agent/logic-v8-integrity-role-routing-20260906]
    paths: ['tools/logic_v8_relation_probe.py', '.github/workflows/logic-v8-relation-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 transformers==4.57.6 accelerate==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: logic-v8-train-dev-features
          run-id: 33989856982
          github-token: ${{ github.token }}
          path: features
      - uses: actions/download-artifact@v4
        with:
          name: logic-v8-2-locked-2d51a0fc1fc7d2e0c3474113869ee6565fa1b911
          run-id: 33991379408
          github-token: ${{ github.token }}
          path: typed
      - name: Classify relations without labels or fitting
        run: |
          set -o pipefail
          python -u tools/logic_v8_relation_probe.py --checkpoint typed/logic-v8-artifacts/fog_logic_v8_2.pt --features features/logic-v8-features.pt --output relation-probe.json | tee relation-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-v8-post-locked-relation-probe
          path: |
            relation-probe.json
            relation-probe.log
          retention-days: 14
