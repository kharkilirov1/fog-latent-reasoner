name: FOG retrofit SmolLM2 dual tap v4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fog-retrofit-smollm135m-v4-dual-tap.yml'
      - 'experiments/fog_retrofit_smollm135m_v4_dual_tap.py'

concurrency:
  group: fog-retrofit-smollm135m-v4-dual-tap
  cancel-in-progress: true

jobs:
  dual-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' 'numpy>=1.26'
      - name: Run dual-tap retrofit
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/fog_retrofit_smollm135m_v4_dual_tap.py 2>&1 | tee dual_tap.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fog-retrofit-smollm135m-v4-dual-tap
          path: |
            dual_tap.log
            retrofit_v4_dual_tap_results.json
            retrofit_v4_dual_tap.pt
          if-no-files-found: warn
