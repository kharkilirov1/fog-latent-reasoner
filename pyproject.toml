[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fog-latent-reasoner"
version = "0.5.0"
description = "Trainable Finite-Operator-Grammar-inspired latent multi-workspace reasoner"
requires-python = ">=3.10"
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
train = [
  "datasets>=3.0,<5",
  "numpy>=1.26",
  "socksio>=1.0",
  "tokenizers>=0.20,<1",
]
dev = [
  "datasets>=3.0,<5",
  "numpy>=1.26",
  "pytest>=8",
  "socksio>=1.0",
  "tokenizers>=0.20,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fog_lmw*"]
